<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Error</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #2c1a21 0%, #121214 70%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .icon-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pulse-ring {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 56, 92, 0.15);
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% {
                transform: scale(0.6);
                opacity: 0.8;
            }
            50% {
                opacity: 0.4;
            }
            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }
        .wifi-icon {
            z-index: 10;
            width: 64px;
            height: 64px;
            fill: #FF385C;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #a5a5a5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 15px;
            color: #a0a0ab;
            line-height: 1.6;
            margin-bottom: 35px;
        }
        .btn {
            position: relative;
            width: 100%;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #FF385C 0%, #D70F46 100%);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 8px 20px rgba(255, 56, 92, 0.3);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 10px rgba(255, 56, 92, 0.2);
        }
        .btn-text {
            transition: opacity 0.2s ease;
        }
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 1s ease-in-out infinite;
            position: absolute;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn.loading .btn-text {
            opacity: 0;
        }
        .btn.loading .spinner {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-container">
            <div class="pulse-ring"></div>
            <svg class="wifi-icon" viewBox="0 0 24 24">
                <path d="M12 21l-12-12c3-3 7-4.5 12-4.5s9 1.5 12 4.5l-12 12zm0-16.5c-4.1 0-7.5 1.2-10 3.7l10 10 10-10c-2.5-2.5-5.9-3.7-10-3.7zm0 6c-2.1 0-3.8.6-5.1 1.9l5.1 5.1 5.1-5.1c-1.3-1.3-3-1.9-5-1.9z"/>
            </svg>
        </div>
        <h1>Connection Lost</h1>
        <p>Please check your internet connection or server status and try again.</p>
        <button id="retryBtn" class="btn" onclick="handleRetry()">
            <span class="btn-text">Retry Connection</span>
            <div class="spinner"></div>
        </button>
    </div>

    <script>
        function handleRetry() {
            var btn = document.getElementById('retryBtn');
            btn.classList.add('loading');
            btn.disabled = true;
            
            // Short delay to allow visual spinner feedback, then trigger native Android callback
            setTimeout(function() {
                if (window.AndroidApp && typeof window.AndroidApp.retryConnection === 'function') {
                    window.AndroidApp.retryConnection();
                } else {
                    // Fallback for testing in normal browser
                    console.log("retryConnection triggered");
                    setTimeout(function() {
                        btn.classList.remove('loading');
                        btn.disabled = false;
                    }, 1000);
                }
            }, 800);
        }
    </script>
</body>
</html>
